<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14070b">
  <meta name="description" content="Nauka hiszpańskiego od A1 do C2: słówka z powtórkami, egzaminy, odmiana czasowników, zwroty i dialogi.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Español JKF</title>
  <script src="style.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="pomin" href="#tresc">Przejdź do nauki</a>
  <header class="gora">
    <div class="marka"><h1>Español</h1><span>JKF</span></div>
    <div class="kapsula-gora szklo">
      <button type="button" class="dzis" id="dzis" aria-label="Dzisiejsza aktywność i seria dni">
        <svg class="pierscien" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="tor"/><circle cx="18" cy="18" r="15" class="wypelnienie" id="dzis-luk"/></svg>
        <span class="dzis-tekst"><b id="dzis-ile">0</b><small id="dzis-cel">/20</small></span>
        <span class="seria" id="seria" title="Seria dni z osiągniętym celem"></span>
      </button>
      <span class="kreska" aria-hidden="true"></span>
      <button type="button" class="ikona-wew" id="ustawienia-btn" aria-label="Ustawienia"></button>
    </div>
  </header>

  <nav class="poziomy szklo" id="poziomy" aria-label="Poziom"></nav>

  <button type="button" class="poziom-linia" id="poziom-info" aria-label="Statystyki poziomu"></button>

  <nav class="zakladki szklo" id="zakladki" aria-label="Sekcje">
    <button type="button" data-z="slowka"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M6 3h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm8 0v5h6M8 13h8M8 17h5"/></svg><span>Słówka</span></button>
    <button type="button" data-z="egzamin"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M9 4h6m-7 2h8a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm1 7 2 2 4-4"/></svg><span>Egzamin</span></button>
    <button type="button" data-z="czasowniki"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M4 6h16M4 12h10M4 18h13M17 10l3 2-3 2"/></svg><span>Czasowniki</span></button>
    <button type="button" data-z="tlumacz"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M3 5h9M7.5 3v2m3 0c-.8 3.4-3.3 6.3-6.5 7.8M6 8.5c1.2 1.8 3 3.3 5 4.2M13 21l4-9 4 9m-6.8-3h5.6"/></svg><span>Tłumacz</span></button>
    <button type="button" data-z="zwroty"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4 4h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm16 5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-1v3l-4-3h-3"/></svg><span>Zwroty</span></button>
  </nav>

  <main id="tresc">
    <section class="panel szklo" id="z-slowka" aria-label="Słówka"></section>
    <section class="panel szklo" id="z-egzamin" aria-label="Egzamin" hidden></section>
    <section class="panel szklo" id="z-czasowniki" aria-label="Czasowniki" hidden></section>
    <section class="panel szklo" id="z-zwroty" aria-label="Zwroty" hidden></section>
    <section class="panel szklo" id="z-tlumacz" aria-label="Tłumacz" hidden></section>
  </main>

  <footer class="stopka">
    <p class="tylko-desktop">Skróty: <kbd>spacja</kbd> odkryj / odsłuchaj · <kbd>1</kbd>–<kbd>4</kbd> ocena lub odpowiedź · <kbd>Enter</kbd> dalej · <kbd>←</kbd> <kbd>→</kbd> zakładki · <kbd>?</kbd> pomoc</p>
    <p>Postęp zapisuje się tylko na tym urządzeniu. Kopię zapasową zrobisz w Ustawieniach (eksport).</p>
  </footer>

  <div class="znaki szklo" id="znaki" hidden role="toolbar" aria-label="Znaki hiszpańskie"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal-tlo" data-zamknij></div>
    <div class="modal-okno szklo" role="dialog" aria-modal="true" aria-labelledby="modal-tytul">
      <div class="modal-gora"><h2 id="modal-tytul"></h2><button type="button" class="ikona ikona--mala" id="modal-zamknij" data-zamknij aria-label="Zamknij">✕</button></div>
      <div class="modal-tresc" id="modal-tresc"></div>
    </div>
  </div>
  <div class="toast szklo" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">Ta aplikacja potrzebuje włączonego JavaScriptu.</p></noscript>
</body>
</html>
