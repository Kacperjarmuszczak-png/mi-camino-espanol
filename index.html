<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1a15">
  <meta name="description" content="Nauka hiszpańskiego od A1 do C2: słówka, egzamin, odmiana czasowników i zwroty.">
  <title>Español JKF</title>
  <script>try { var m = JSON.parse(localStorage.getItem('es-nauka') || '{}').motyw; if (m) document.documentElement.dataset.theme = m; } catch (e) {}</script>
  <link rel="preload" href="fonts/jost-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="czcionki.css">
  <link rel="stylesheet" href="styl.css">
</head>
<body>
  <header class="gora">
    <h1>Español <span>JKF</span></h1>
    <button type="button" class="ikona" id="motyw" aria-label="Zmień jasny / ciemny motyw">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
  </header>

  <nav class="poziomy" id="poziomy" aria-label="Poziom"></nav>
  <p class="opis" id="opis"></p>

  <nav class="zakladki" id="zakladki" aria-label="Sekcje">
    <button type="button" data-z="slowka">Słówka</button>
    <button type="button" data-z="egzamin">Egzamin</button>
    <button type="button" data-z="czasowniki">Czasowniki</button>
    <button type="button" data-z="zwroty">Zwroty</button>
  </nav>

  <main>
    <!-- SŁÓWKA -->
    <section class="panel" id="z-slowka">
      <div class="wiersz">
        <label class="wybor"><span>Temat</span><select id="f-temat"></select></label>
        <div class="seg" id="f-kier" role="group" aria-label="Najpierw pokazuj">
          <button type="button" data-k="es">ES → PL</button><button type="button" data-k="pl">PL → ES</button>
        </div>
      </div>
      <div class="pasek" aria-hidden="true"><i id="f-pasek"></i></div>
      <button type="button" class="fiszka" id="fiszka" aria-label="Odwróć kartę">
        <small id="f-podp"></small>
        <b id="f-slowo"></b>
        <span id="f-odp" class="odp"></span>
        <em id="f-hint">stuknij, żeby zobaczyć tłumaczenie</em>
      </button>
      <div class="wiersz">
        <span class="male"><span id="f-licznik"></span> <i id="f-autor" class="autor"></i></span>
        <button type="button" class="glos" id="f-glos" aria-label="Posłuchaj wymowy"></button>
      </div>
      <div class="przyciski" id="f-przyciski">
        <button type="button" class="btn" id="f-nie">Jeszcze nie</button>
        <button type="button" class="btn btn--zloty" id="f-tak">Umiem</button>
      </div>
      <details class="lista-slow">
        <summary>Lista słów</summary>
        <input type="search" id="s-szukaj" placeholder="Szukaj po polsku albo po hiszpańsku" autocomplete="off" spellcheck="false" aria-label="Szukaj słowa">
        <ul class="lista" id="s-lista"></ul>
      </details>
    </section>

    <!-- EGZAMIN -->
    <section class="panel" id="z-egzamin" hidden>
      <div id="e-tresc" aria-live="polite"></div>
    </section>

    <!-- CZASOWNIKI -->
    <section class="panel" id="z-czasowniki" hidden>
      <div class="szukaj">
        <input id="o-szukaj" type="search" list="o-lista" placeholder="Czasownik, np. tener albo „mieć”" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Szukaj czasownika">
        <datalist id="o-lista"></datalist>
        <button type="button" class="btn btn--male" id="o-losuj">Losuj</button>
      </div>
      <div>
        <h2 id="o-bezok"></h2>
        <p class="male" id="o-info"></p>
      </div>
      <div class="czasy" id="o-czasy" role="tablist" aria-label="Czas"></div>
      <p class="male" id="o-opis"></p>
      <table class="tabela" id="o-tabela"></table>

      <div class="cwicz">
        <p class="etykieta">Ćwiczenie</p>
        <p class="zadanie" id="c-zadanie"></p>
        <form class="szukaj" id="c-form" autocomplete="off">
          <input id="c-wpis" type="text" placeholder="wpisz formę" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Forma czasownika">
          <button class="btn btn--zloty btn--male" id="c-sprawdz" type="submit">Sprawdź</button>
        </form>
        <div class="klawisze" id="c-klawisze"></div>
        <p class="komunikat" id="c-komunikat" aria-live="polite"></p>
        <p class="male">Seria: <b id="c-seria">0</b> · najlepsza: <b id="c-najlepsza">0</b></p>
      </div>
    </section>

    <!-- ZWROTY -->
    <section class="panel" id="z-zwroty" hidden>
      <label class="wybor"><span>Sytuacja</span><select id="z-temat"></select></label>
      <ul class="lista" id="z-lista"></ul>
    </section>
  </main>

  <footer class="stopka">Postęp zapisuje się tylko na tym urządzeniu.<br>Nagrania wymowy: rodzimi użytkownicy hiszpańskiego z projektu <a href="https://lingualibre.org/">Lingua Libre</a>, licencje <a href="https://creativecommons.org/licenses/by/4.0/deed.pl">CC BY</a> i <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.pl">CC BY-SA</a> (autor podany przy słowie). Gdy nagrania brak, mówi głos telefonu.</footer>

  <script src="slowa.js"></script>
  <script src="nagrania.js"></script>
  <script src="czasowniki.js"></script>
  <script src="zwroty.js"></script>
  <script src="app.js"></script>
</body>
</html>
